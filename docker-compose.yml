services:
  mongodb:
    image: mongo:8
    container_name: automation-platform-mongodb
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: automation_platform
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data: